workflows:
  android-debug:
    name: Android debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Resolve dependencies
        script: |
          set -eu
          cd "$CM_BUILD_DIR/app"
          flutter pub get
      - name: Build debug APK
        script: |
          set -eu
          cd "$CM_BUILD_DIR/app"
          flutter build apk --debug
    artifacts:
      - app/build/app/outputs/flutter-apk/app-debug.apk
