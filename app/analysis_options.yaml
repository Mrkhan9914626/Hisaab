include: package:flutter_lints/flutter.yaml

# Formatter and analyzer rules for the Expense Tracker app.
# Warnings must stay visible: do not downgrade or ignore analyzer findings here.
analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - ios/Pods/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
